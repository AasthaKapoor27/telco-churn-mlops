version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churniq-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=model.pkl
      - COLUMNS_PATH=columns.pkl
    volumes:
      - ./backend/model.pkl:/app/model.pkl:ro
      - ./backend/columns.pkl:/app/columns.pkl:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churniq-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: churniq-network
